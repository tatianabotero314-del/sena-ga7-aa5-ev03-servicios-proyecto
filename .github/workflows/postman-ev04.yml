name: Pruebas Postman AA5-EV04
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/postman-ev04.yml'
      - 'postman/**'
permissions:
  contents: write
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versionar coleccion y documentacion
        run: |
          python3 - <<'PYCODE'
          import base64,io,zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(""))).extractall('.')
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postman docs/PRUEBAS_AA5_EV04.md
          git diff --cached --quiet || git commit -m "Agregar 60 solicitudes Postman y plan de pruebas AA5-EV04"
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - name: Iniciar API del proyecto
        run: |
          java -jar backend/target/seleccion-personal-api-1.0.0.jar --spring.datasource.url='jdbc:h2:mem:ev04;DB_CLOSE_DELAY=-1' > servicio.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/api/auth/csrf > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ejecutar coleccion Postman con Newman
        run: |
          npm install --no-save newman@6.2.1
          npx newman run postman/AA5_EV04.postman_collection.json --reporters cli,json,junit --reporter-json-export resultados/newman-original.json --reporter-junit-export resultados/newman.xml | tee resultados-newman.txt
        shell: bash -eo pipefail {0}
      - name: Preparar reportes sin tokens
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,pathlib
          f=pathlib.Path('resultados/newman-original.json')
          if f.exists():
              d=json.loads(f.read_text())
              rows=[]
              for e in d['run']['executions']:
                  response=e.get('response',{})
                  data=response.get('stream',{}).get('data',[])
                  raw=bytes(data).decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except ValueError: body=raw
                  if isinstance(body,dict) and 'token' in body: body['token']='[omitido]'
                  rows.append({'nombre':e['item']['name'],'metodo':e['request']['method'],'url':e['request']['url'],'estado':response.get('code'),'respuesta':body,'verificaciones':e.get('assertions',[])})
              report={'origen':'Newman 6.2.1 - coleccion Postman AA5-EV04','estadisticas':d['run']['stats'],'fallos':d['run']['failures'],'ejecuciones':rows}
              pathlib.Path('resultados/newman.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              f.unlink()
          PYCODE
          git bundle create historial-github.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultados-Postman-AA5-EV04
          path: |
            resultados
            resultados-newman.txt
            backend/target/surefire-reports
            historial-github.bundle
