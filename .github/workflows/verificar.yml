name: Verificar servicios del proyecto
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Incorporar fuente versionada
        run: |
          if [ ! -f backend/pom.xml ]; then
            python3 - <<'PYCODE'
          import base64,io,zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(""))).extractall('.')
          PYCODE
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend docs scripts README.md .gitignore
          git diff --cached --quiet || git commit -m "Implementar servicios del proyecto y documentar contrato REST"
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y probar Spring Boot
        run: mvn -B -f backend/pom.xml verify
      - name: Iniciar API aislada
        run: |
          java -jar backend/target/seleccion-personal-api-1.0.0.jar --spring.datasource.url='jdbc:h2:mem:proyecto;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE' > servicio.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/api/auth/csrf; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verificar servicios por HTTP real
        run: python3 scripts/verificar_api.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar React y Vite
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Conservar fuente y versionamiento
        if: always()
        run: |
          git bundle create historial-github.bundle --all
          zip -r fuentes.zip backend/src backend/pom.xml frontend/src frontend/tests frontend/package.json frontend/package-lock.json frontend/index.html frontend/vite.config.js frontend/eslint.config.js frontend/playwright.config.js docs scripts README.md .gitignore .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Servicios-AA5-EV03
          path: |
            backend/target/seleccion-personal-api-1.0.0.jar
            backend/target/surefire-reports
            resultados
            frontend/playwright-report
            frontend/test-results
            servicio.log
            fuentes.zip
            historial-github.bundle
