spring.application.name=seleccion-personal-api
server.port=8081
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/seleccion;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.password=${DEMO_PASSWORD:Practica2026!}

# El contrato rechaza campos ajenos a los DTO.
spring.jackson.deserialization.fail-on-unknown-properties=true
